
name: Check PR Source Branch

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  check-source:
    name: Check source branch
    runs-on: ubuntu-latest

    steps:
      - name: Verify source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Source: $SOURCE_BRANCH"
          echo "Target: $TARGET_BRANCH"

          if [[ "$TARGET_BRANCH" == "main" ]]; then
            if [[ "$SOURCE_BRANCH" != "develop" ]]; then
              echo "::error::Only develop can merge into main."
              exit 1
            fi

          elif [[ "$TARGET_BRANCH" == "develop" ]]; then
            if [[ "$SOURCE_BRANCH" != "backend" &&
                  "$SOURCE_BRANCH" != "frontend" &&
                  "$SOURCE_BRANCH" != "data" ]]; then
              echo "::error::Only backend, frontend and data can merge into develop."
              exit 1
            fi
          fi

          echo "Branch source validation passed."
